name: build
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Generated datapack is up to date
        run: |
          python3 tools/extract_vanilla.py
          python3 tools/build_datapack.py > /dev/null
          git diff --exit-code -- fabric/src/main/resources/data || { echo "::error::Re-run tools/build_datapack.py and commit the result"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: atlasmountains-jar
          path: fabric/build/libs/atlasmountains-*.jar
          if-no-files-found: error
